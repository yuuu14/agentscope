<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentScope Agent 执行流程</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 20px; font-weight: 650; fill: var(--fg); }
  .label { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--fg); opacity: 0.85; }
  .note { font-size: 11.5px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; }
</style>
<main>
<svg viewBox="0 0 960 990" role="img" aria-label="AgentScope Agent 执行流程图">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)" />
    </marker>
  </defs>

  <!-- ===== connectors first (arrows sit behind boxes) ===== -->
  <path class="edge" d="M480,100 V116" marker-end="url(#a)" />
  <path class="edge" d="M480,164 V184" marker-end="url(#a)" />
  <path class="edge" d="M480,224 V244" marker-end="url(#a)" />
  <path class="edge" d="M480,288 V308" marker-end="url(#a)" />
  <path class="edge" d="M480,352 V396" marker-end="url(#a)" />
  <path class="edge" d="M710,266 H740" marker-end="url(#a)" />

  <!-- decision fan-out to three branches -->
  <path class="edge" d="M480,440 V455" />
  <path class="edge" d="M480,455 H180 V470" marker-end="url(#a)" />
  <path class="edge" d="M480,455 V470" marker-end="url(#a)" />
  <path class="edge" d="M480,455 H780 V470" marker-end="url(#a)" />

  <!-- left column (Reasoning) -->
  <path class="edge" d="M180,522 V540" marker-end="url(#a)" />
  <path class="edge" d="M180,584 V610" marker-end="url(#a)" />
  <!-- middle column (Acting) -->
  <path class="edge" d="M480,522 V540" marker-end="url(#a)" />
  <path class="edge" d="M480,584 V610" marker-end="url(#a)" />
  <!-- right column (Exit) -->
  <path class="edge" d="M780,522 V540" marker-end="url(#a)" />
  <path class="edge" d="M780,584 V610" marker-end="url(#a)" />

  <!-- loop back: Reasoning + Acting converge, return to _next_action on the left -->
  <path class="edge" d="M180,654 V690" />
  <path class="edge" d="M480,654 V690" />
  <path class="edge" d="M180,690 H60 V418 H370" marker-end="url(#a)" />

  <!-- Exit leaves the loop to the output -->
  <path class="edge" d="M780,654 V820 H480 V870" marker-end="url(#a)" />

  <!-- ===== zones ===== -->
  <rect class="zone" x="40" y="376" width="880" height="470" rx="12" />
  <text class="note" x="56" y="394">ReAct 主循环（while True）</text>

  <!-- ===== nodes ===== -->
  <rect class="node input" x="320" y="56" width="320" height="44" rx="8" />
  <text class="label" x="480" y="83" text-anchor="middle">reply() / reply_stream()</text>

  <rect class="node process" x="250" y="116" width="460" height="48" rx="8" />
  <text class="label" x="480" y="136" text-anchor="middle">_reply()：on_reply 中间件链（洋葱）</text>
  <text class="small" x="480" y="153" text-anchor="middle">_receive_reply_end —— 中间件吞掉 ReplyEndEvent 可强制再来一轮</text>

  <rect class="node process" x="370" y="184" width="220" height="40" rx="8" />
  <text class="label" x="480" y="209" text-anchor="middle">_reply_impl() 入口</text>

  <rect class="node neutral" x="250" y="244" width="460" height="44" rx="8" />
  <text class="label" x="480" y="264" text-anchor="middle">Step 1 · 输入分派</text>
  <text class="small" x="480" y="280" text-anchor="middle">HITL 事件（确认/中断/外部结果） vs 新 Msg</text>

  <rect class="node risk" x="740" y="244" width="200" height="44" rx="8" />
  <text class="label" x="840" y="264" text-anchor="middle">UserInterruptEvent</text>
  <text class="small" x="840" y="280" text-anchor="middle">短路收尾，不进循环</text>

  <rect class="node neutral" x="250" y="308" width="460" height="44" rx="8" />
  <text class="label" x="480" y="328" text-anchor="middle">Step 2 · 续传停泊回复 or 开新回复</text>
  <text class="small" x="480" y="344" text-anchor="middle">ReplyStartEvent · 按需注册结构化输出工具</text>

  <rect class="node process" x="370" y="396" width="220" height="44" rx="8" />
  <text class="label" x="480" y="416" text-anchor="middle">_next_action()</text>
  <text class="small" x="480" y="432" text-anchor="middle">只读决策：三选一</text>

  <!-- Reasoning column -->
  <rect class="node process" x="60" y="470" width="240" height="52" rx="8" />
  <text class="label" x="180" y="492" text-anchor="middle">Reasoning</text>
  <text class="small" x="180" y="509" text-anchor="middle">hint / tool_choice</text>

  <rect class="node neutral" x="60" y="540" width="240" height="44" rx="8" />
  <text class="label" x="180" y="560" text-anchor="middle">压缩 → 注入运行时状态</text>
  <text class="small" x="180" y="576" text-anchor="middle">→ _reasoning 调模型</text>

  <rect class="node neutral" x="60" y="610" width="240" height="44" rx="8" />
  <text class="label" x="180" y="630" text-anchor="middle">流式吐 block 事件</text>
  <text class="small" x="180" y="646" text-anchor="middle">→ 写入 state.context</text>

  <!-- Acting column -->
  <rect class="node process" x="360" y="470" width="240" height="52" rx="8" />
  <text class="label" x="480" y="492" text-anchor="middle">Acting</text>
  <text class="small" x="480" y="509" text-anchor="middle">tool_calls</text>

  <rect class="node neutral" x="360" y="540" width="240" height="44" rx="8" />
  <text class="label" x="480" y="560" text-anchor="middle">分批：并发 / 串行</text>
  <text class="small" x="480" y="576" text-anchor="middle">按 is_concurrency_safe</text>

  <rect class="node neutral" x="360" y="610" width="240" height="44" rx="8" />
  <text class="label" x="480" y="630" text-anchor="middle">权限检查 → 执行工具</text>
  <text class="small" x="480" y="646" text-anchor="middle">→ ToolResult 回灌</text>

  <!-- Exit column -->
  <rect class="node external" x="660" y="470" width="240" height="52" rx="8" />
  <text class="label" x="780" y="492" text-anchor="middle">Exit</text>
  <text class="small" x="780" y="509" text-anchor="middle">exit_events / exit_msg</text>

  <rect class="node risk" x="660" y="540" width="240" height="44" rx="8" />
  <text class="label" x="780" y="560" text-anchor="middle">事件为空 = 停泊</text>
  <text class="small" x="780" y="576" text-anchor="middle">等权限 / 外部执行（未结束）</text>

  <rect class="node external" x="660" y="610" width="240" height="44" rx="8" />
  <text class="label" x="780" y="630" text-anchor="middle">事件非空 = 结束</text>
  <text class="small" x="780" y="646" text-anchor="middle">ReplyEndEvent（+ 最终 Msg）</text>

  <text class="note" x="70" y="732">一轮 = 一次推理 + 它产生的全部工具调用都有结果 → cur_iter += 1</text>
  <text class="note" x="70" y="750">cur_iter == max_iters 时：强制一次「不许调工具」的收尾推理</text>

  <rect class="node storage" x="300" y="870" width="360" height="44" rx="8" />
  <text class="label" x="480" y="890" text-anchor="middle">AgentEvent 流 → 前端 / 上层</text>
  <text class="small" x="480" y="906" text-anchor="middle">Msg 只在最后出现（它终止流）</text>

  <!-- legend -->
  <rect class="node input" x="330" y="944" width="14" height="14" rx="3" />
  <text class="note" x="350" y="956">入口</text>
  <rect class="node process" x="410" y="944" width="14" height="14" rx="3" />
  <text class="note" x="430" y="956">处理</text>
  <rect class="node risk" x="490" y="944" width="14" height="14" rx="3" />
  <text class="note" x="510" y="956">停泊 / 中断</text>
  <rect class="node external" x="600" y="944" width="14" height="14" rx="3" />
  <text class="note" x="620" y="956">结束</text>
</svg>
</main>
