<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentScope Agent 执行流程</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main { max-width: 1040px; margin: 20px auto; padding: 0 16px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 19px; font-weight: 650; fill: var(--fg); }
  .sub { font-size: 11px; fill: var(--muted); }
  .label { font-size: 15px; font-weight: 650; fill: var(--fg); }
  .small { font-size: 11.5px; fill: var(--fg); opacity: 0.85; }
  .edge-label { font-size: 11px; fill: var(--muted); }
  .note { font-size: 11.5px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .neutral { fill: var(--neutral); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .loop { stroke: var(--line); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.75; }
</style>
<main>
<svg viewBox="0 0 1000 700" role="img" aria-label="AgentScope Agent 执行流程图">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)" />
    </marker>
  </defs>

  <!-- ================= connectors first ================= -->
  <!-- entry -> decision -->
  <path class="edge" d="M500,122 V162" marker-end="url(#a)" />

  <!-- decision -> three branches -->
  <path class="edge" d="M500,218 V236" />
  <path class="edge" d="M500,236 H195 V258" marker-end="url(#a)" />
  <path class="edge" d="M500,236 V258" marker-end="url(#a)" />
  <path class="edge" d="M500,236 H805 V258" marker-end="url(#a)" />

  <!-- loop back: Reasoning + Acting -> _next_action -->
  <path class="loop" d="M195,314 V340" />
  <path class="loop" d="M500,314 V340 H195" />
  <path class="loop" d="M195,340 H40 V190 H385" marker-end="url(#a)" />

  <!-- Exit: 事件为空 -> 停泊 -> 等下次输入 -->
  <path class="edge" d="M905,286 H950 V96 H620" marker-end="url(#a)" />
  <!-- Exit: 事件非空 -> 结束 -->
  <path class="edge" d="M805,314 V470 H500 V580" marker-end="url(#a)" />

  <!-- ================= zones ================= -->
  <rect class="zone" x="60" y="228" width="620" height="140" rx="12" />
  <text class="note" x="74" y="246">ReAct 循环</text>

  <!-- ================= nodes ================= -->
  <rect class="node input" x="380" y="70" width="240" height="52" rx="8" />
  <text class="label" x="500" y="93" text-anchor="middle">reply_stream() / reply()</text>
  <text class="small" x="500" y="111" text-anchor="middle">_reply()：on_reply 中间件链</text>

  <rect class="node process" x="385" y="162" width="230" height="56" rx="8" />
  <text class="label" x="500" y="186" text-anchor="middle">_next_action()</text>
  <text class="small" x="500" y="204" text-anchor="middle">只读决策：三选一</text>

  <rect class="node process" x="95" y="258" width="200" height="56" rx="8" />
  <text class="label" x="195" y="282" text-anchor="middle">Reasoning</text>
  <text class="small" x="195" y="300" text-anchor="middle">调模型</text>

  <rect class="node process" x="400" y="258" width="200" height="56" rx="8" />
  <text class="label" x="500" y="282" text-anchor="middle">Acting</text>
  <text class="small" x="500" y="300" text-anchor="middle">执行工具</text>

  <rect class="node external" x="705" y="258" width="200" height="56" rx="8" />
  <text class="label" x="805" y="282" text-anchor="middle">Exit</text>
  <text class="small" x="805" y="300" text-anchor="middle">结束，或停泊</text>

  <rect class="node storage" x="405" y="580" width="190" height="56" rx="8" />
  <text class="label" x="500" y="604" text-anchor="middle">AgentEvent 流</text>
  <text class="small" x="500" y="622" text-anchor="middle">→ 前端 / 上层</text>

  <!-- ================= edge labels ================= -->
  <text class="edge-label" x="88" y="404">一轮结束：一次推理 + 其全部工具调用都有结果 → cur_iter += 1</text>
  <text class="edge-label" x="520" y="462" text-anchor="start">事件非空 → 结束（ReplyEndEvent）</text>
  <text class="edge-label" x="795" y="84" text-anchor="middle">事件为空 → 停泊，等下次输入续传</text>
  <text class="edge-label" x="212" y="250" text-anchor="start">默认 / 需结构化输出 / 已达 max_iters</text>
  <text class="edge-label" x="560" y="250" text-anchor="start">有可执行工具调用</text>

  <!-- ================= title + legend ================= -->
  <text class="title" x="500" y="34" text-anchor="middle">AgentScope Agent 执行流程</text>
  <text class="note" x="60" y="672">状态写入 state.context（同一次回复累积到一条 assistant 消息）</text>

  <rect class="node input" x="470" y="662" width="13" height="13" rx="3" />
  <text class="note" x="489" y="673">入口</text>
  <rect class="node process" x="545" y="662" width="13" height="13" rx="3" />
  <text class="note" x="564" y="673">处理</text>
  <rect class="node external" x="620" y="662" width="13" height="13" rx="3" />
  <text class="note" x="639" y="673">结束 / 停泊</text>
  <rect class="node storage" x="735" y="662" width="13" height="13" rx="3" />
  <text class="note" x="754" y="673">输出</text>
</svg>
</main>
